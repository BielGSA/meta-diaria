<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Meta Diária" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>Minha Meta Diária</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --success: #16a34a;
      --danger: #dc2626;
      --primary: #2563eb;
      --shadow: 0 10px 28px rgba(0,0,0,.08);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: max(18px, env(safe-area-inset-top)) 14px max(20px, env(safe-area-inset-bottom));
    }
    .app { width: min(100%, 520px); margin: 0 auto; }
    .topbar {
      display:flex; align-items:center; justify-content:space-between;
      gap:12px; margin-bottom:14px;
    }
    .title-wrap { display:flex; align-items:center; gap:10px; }
    .logo { width:44px; height:44px; border-radius:12px; }
    h1 { margin:0; font-size:25px; line-height:1.1; }
    .subtitle { color:var(--muted); font-size:12px; margin-top:3px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 17px;
      box-shadow: var(--shadow);
      margin-bottom: 13px;
    }
    .row { display:flex; gap:9px; align-items:center; }
    .row > * { flex:1; }
    label {
      display:block; font-size:13px; color:var(--muted);
      margin-bottom:6px; font-weight:700;
    }
    input {
      width:100%; border:1px solid var(--border); border-radius:12px;
      padding:14px; font-size:18px; outline:none; background:white;
    }
    input:focus { border-color:var(--primary); }
    button {
      border:0; border-radius:12px; padding:14px 12px;
      font-size:15px; font-weight:700; cursor:pointer;
      min-height:48px;
    }
    .primary { background:var(--primary); color:white; }
    .secondary { background:#e5e7eb; color:var(--text); }
    .danger { background:#fee2e2; color:var(--danger); }
    .install {
      background:#111827; color:white; width:auto; padding:10px 12px;
      min-height:40px; display:none;
    }
    .stats { display:grid; grid-template-columns:1fr 1fr; gap:9px; }
    .stat {
      background:#f9fafb; border-radius:14px; padding:13px;
      border:1px solid var(--border);
    }
    .stat small { display:block; color:var(--muted); margin-bottom:5px; font-weight:700; }
    .stat strong { font-size:20px; }
    .progress-wrap { margin-top:14px; }
    .progress-bg {
      width:100%; height:16px; background:#e5e7eb;
      border-radius:999px; overflow:hidden;
    }
    .progress-bar {
      height:100%; width:0%; background:var(--success);
      transition:width .25s ease;
    }
    .progress-text {
      margin-top:8px; display:flex; justify-content:space-between;
      gap:10px; font-size:13px; color:var(--muted);
    }
    .quick { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:10px; }
    .quick button { background:#eef2ff; color:#3730a3; padding:10px; min-height:44px; }
    .history { max-height:260px; overflow:auto; }
    .history-item {
      display:flex; justify-content:space-between; align-items:center;
      padding:11px 0; border-bottom:1px solid var(--border); font-size:15px;
    }
    .history-item:last-child { border-bottom:none; }
    .empty { color:var(--muted); text-align:center; padding:12px 0; }
    .meta-note { font-size:12px; color:var(--muted); margin-top:8px; }
    .goal-hit { color:var(--success); font-weight:800; }
    .offline {
      display:none; text-align:center; font-size:12px; color:var(--muted);
      margin:8px 0 12px;
    }
    @media (max-width:430px) {
      .stats { grid-template-columns:1fr 1fr; }
      .quick { grid-template-columns:repeat(2,1fr); }
      h1 { font-size:22px; }
      .row.mobile-stack { flex-direction:column; align-items:stretch; }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="topbar">
      <div class="title-wrap">
        <img class="logo" src="icon-192.png" alt="">
        <div>
          <h1>Minha Meta Diária</h1>
          <div class="subtitle">Controle seus ganhos do dia</div>
        </div>
      </div>
      <button id="installBtn" class="install">Instalar</button>
    </div>

    <div id="offlineMsg" class="offline">Você está offline. O app continua funcionando normalmente.</div>

    <section class="card">
      <label for="goal">Meta do dia</label>
      <div class="row mobile-stack">
        <input id="goal" inputmode="decimal" placeholder="Ex.: 500" />
        <button class="secondary" id="saveGoal">Salvar meta</button>
      </div>
      <div class="meta-note">A meta e os lançamentos ficam salvos neste aparelho.</div>
    </section>

    <section class="card">
      <div class="stats">
        <div class="stat">
          <small>Total acumulado</small>
          <strong id="total">R$ 0,00</strong>
        </div>
        <div class="stat">
          <small>Faltam</small>
          <strong id="remaining">R$ 500,00</strong>
        </div>
        <div class="stat">
          <small>Progresso</small>
          <strong id="progress">0,00%</strong>
        </div>
        <div class="stat">
          <small>Restante</small>
          <strong id="remainingPct">100,00%</strong>
        </div>
      </div>
      <div class="progress-wrap">
        <div class="progress-bg"><div class="progress-bar" id="progressBar"></div></div>
        <div class="progress-text">
          <span id="progressLabel">0,00%</span>
          <span id="goalLabel">Meta: R$ 500,00</span>
        </div>
      </div>
    </section>

    <section class="card">
      <label for="amount">Adicionar ganho</label>
      <div class="row">
        <input id="amount" inputmode="decimal" placeholder="Ex.: 25 ou 18,50" />
        <button class="primary" id="add">Adicionar</button>
      </div>
      <div class="quick">
        <button data-value="10">+ R$ 10</button>
        <button data-value="20">+ R$ 20</button>
        <button data-value="50">+ R$ 50</button>
        <button data-value="100">+ R$ 100</button>
      </div>
      <div class="row" style="margin-top:12px;">
        <button class="secondary" id="undo">Desfazer último</button>
        <button class="danger" id="reset">Zerar o dia</button>
      </div>
    </section>

    <section class="card">
      <label>Histórico de lançamentos</label>
      <div id="history" class="history"></div>
    </section>
  </main>

  <script>
    const STORAGE_KEY = "metaDiariaApp_v2";
    let state = { goal: 500, entries: [] };
    let deferredPrompt = null;

    const $ = id => document.getElementById(id);
    const el = {
      goal:$("goal"), saveGoal:$("saveGoal"), amount:$("amount"), add:$("add"),
      total:$("total"), remaining:$("remaining"), progress:$("progress"),
      remainingPct:$("remainingPct"), progressBar:$("progressBar"),
      progressLabel:$("progressLabel"), goalLabel:$("goalLabel"),
      history:$("history"), undo:$("undo"), reset:$("reset"),
      installBtn:$("installBtn"), offlineMsg:$("offlineMsg")
    };

    function parseMoney(value) {
      value = String(value).trim().replace(/\s/g,"");
      if (value.includes(",") && value.includes(".")) {
        value = value.replace(/\./g,"").replace(",",".");
      } else value = value.replace(",",".");
      const number = Number(value);
      return Number.isFinite(number) ? number : NaN;
    }

    function money(value) {
      return value.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
    }

    function pct(value) {
      return value.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})+"%";
    }

    function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

    function load(){
      const saved = localStorage.getItem(STORAGE_KEY);
      if(!saved) return;
      try{
        const parsed = JSON.parse(saved);
        if(typeof parsed.goal==="number" && Array.isArray(parsed.entries)) state=parsed;
      }catch{}
    }

    function getTotal(){ return state.entries.reduce((s,e)=>s+e.value,0); }

    function update(){
      const total=getTotal();
      const goal=state.goal>0?state.goal:500;
      const remaining=Math.max(goal-total,0);
      const progressRaw=goal>0?(total/goal)*100:0;
      const progressDisplay=Math.max(progressRaw,0);
      const remainingPct=Math.max(100-progressRaw,0);

      el.goal.value=String(goal).replace(".",",");
      el.total.textContent=money(total);
      el.remaining.textContent=money(remaining);
      el.progress.textContent=pct(progressDisplay);
      el.remainingPct.textContent=pct(remainingPct);
      el.progressLabel.textContent=pct(progressDisplay);
      el.goalLabel.textContent="Meta: "+money(goal);
      el.progressBar.style.width=Math.min(progressDisplay,100)+"%";

      if(total>=goal){
        el.remaining.textContent="Meta batida!";
        el.remaining.classList.add("goal-hit");
      }else el.remaining.classList.remove("goal-hit");

      renderHistory(); save();
    }

    function renderHistory(){
      if(state.entries.length===0){
        el.history.innerHTML='<div class="empty">Nenhum lançamento ainda.</div>';
        return;
      }
      el.history.innerHTML=[...state.entries].reverse().map(entry=>{
        const time=new Date(entry.date).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
        const sign=entry.value>=0?"+":"−";
        return `<div class="history-item"><span>${time}</span><strong>${sign} ${money(Math.abs(entry.value))}</strong></div>`;
      }).join("");
    }

    function addAmount(value){
      const number=parseMoney(value);
      if(!Number.isFinite(number)||number===0){ alert("Digite um valor válido."); return; }
      state.entries.push({value:number,date:new Date().toISOString()});
      el.amount.value=""; el.amount.focus(); update();
    }

    el.saveGoal.addEventListener("click",()=>{
      const goal=parseMoney(el.goal.value);
      if(!Number.isFinite(goal)||goal<=0){ alert("Digite uma meta válida."); return; }
      state.goal=goal; update();
    });

    el.add.addEventListener("click",()=>addAmount(el.amount.value));
    el.amount.addEventListener("keydown",e=>{if(e.key==="Enter") addAmount(el.amount.value);});
    document.querySelectorAll(".quick button").forEach(b=>b.addEventListener("click",()=>addAmount(b.dataset.value)));

    el.undo.addEventListener("click",()=>{
      if(!state.entries.length) return;
      state.entries.pop(); update();
    });

    el.reset.addEventListener("click",()=>{
      if(!state.entries.length) return;
      if(confirm("Deseja realmente zerar todos os lançamentos do dia?")){
        state.entries=[]; update();
      }
    });

    window.addEventListener("beforeinstallprompt", e=>{
      e.preventDefault();
      deferredPrompt=e;
      el.installBtn.style.display="block";
    });

    el.installBtn.addEventListener("click", async ()=>{
      if(!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt=null;
      el.installBtn.style.display="none";
    });

    window.addEventListener("appinstalled",()=>{ el.installBtn.style.display="none"; });

    function updateOnline(){
      el.offlineMsg.style.display=navigator.onLine?"none":"block";
    }
    window.addEventListener("online",updateOnline);
    window.addEventListener("offline",updateOnline);
    updateOnline();

    if("serviceWorker" in navigator){
      window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));
    }

    load(); update();
  </script>
</body>
</html>
