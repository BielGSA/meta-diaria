name: Build DriveMeta Official APK

on:
  push:
    branches:
      - teste-bolha-atalho
    paths:
      - 'android-bubble/**'
      - '.github/workflows/build-bubble-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK
        run: gradle -p android-bubble assembleRelease

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: DriveMeta-1.3.0-release-unsigned
          path: android-bubble/app/build/outputs/apk/release/app-release-unsigned.apk
